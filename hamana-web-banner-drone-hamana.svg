<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22bdd7"/>
      <stop offset="1" stop-color="#007ca9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00516d" flood-opacity=".20"/>
    </filter>
    <filter id="motionBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="bamboo" x1="0" x2="1">
      <stop offset="0" stop-color="#6c5523"/>
      <stop offset=".25" stop-color="#c5a35d"/>
      <stop offset=".52" stop-color="#e3c87a"/>
      <stop offset=".76" stop-color="#a37e38"/>
      <stop offset="1" stop-color="#654d1f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#sky)"/>
  <path d="M1040 112 C1095 50 1197 76 1219 142 C1274 102 1352 138 1358 202 L1012 202 C1011 165 1023 132 1040 112 Z" fill="#fff" opacity=".14"/>
  <path d="M88 572 C140 520 227 535 248 590 C293 551 366 586 370 642 L30 642 C31 615 59 589 88 572 Z" fill="#fff" opacity=".09"/>
  <text x="126" y="172" fill="#e6fbff" font-size="27" font-family="Meiryo,sans-serif" font-weight="700" letter-spacing="4">DRONE FLIGHT PERMIT SUPPORT</text>
  <text x="120" y="317" fill="#fff" font-size="100" font-family="Meiryo,sans-serif" font-weight="700">浜名行政書士事務所</text>
  <text x="128" y="393" fill="#e6fbff" font-size="36" font-family="Meiryo,sans-serif">ドローン飛行の許可・承認申請をサポート</text>
  <text x="128" y="450" fill="#e6fbff" font-size="36" font-family="Meiryo,sans-serif">各種許認可、相続、補助金申請など、</text>
  <text x="128" y="505" fill="#e6fbff" font-size="36" font-family="Meiryo,sans-serif">行政手続きも幅広く対応します</text>
  <!-- 旧ドローン案（比較用に非表示） -->
  <g display="none" transform="translate(1060 205)" filter="url(#shadow)">
    <!-- 背負い旗：口を旗の中央に揃えた、まっすぐな家旗 -->
    <path d="M222 154 L254 -104" fill="none" stroke="#253c45" stroke-width="9" stroke-linecap="round"/>
    <rect x="254" y="-104" width="126" height="210" fill="#ffffff" stroke="#e9f5f6" stroke-width="3"/>
    <rect x="281" y="-62" width="72" height="62" fill="none" stroke="#151515" stroke-width="18"/>
    <rect x="281" y="47" width="72" height="62" fill="none" stroke="#151515" stroke-width="18"/>
    <!-- 回転中のプロペラ：半透明の円盤、短い残像、ぼかしで速度感を表現 -->
    <g filter="url(#motionBlur)" fill="none" stroke="#d9f8fa" stroke-linecap="round">
      <ellipse cx="55" cy="82" rx="66" ry="17" stroke-width="11" opacity=".34" transform="rotate(-14 55 82)"/>
      <ellipse cx="351" cy="82" rx="66" ry="17" stroke-width="11" opacity=".34" transform="rotate(14 351 82)"/>
      <ellipse cx="105" cy="220" rx="56" ry="14" stroke-width="10" opacity=".30" transform="rotate(16 105 220)"/>
      <ellipse cx="301" cy="220" rx="56" ry="14" stroke-width="10" opacity=".30" transform="rotate(-16 301 220)"/>
    </g>
    <g fill="none" stroke="#203943" stroke-linecap="round" opacity=".58">
      <path d="M6 75 Q55 42 104 75" stroke-width="8"/>
      <path d="M302 75 Q351 42 400 75" stroke-width="8"/>
      <path d="M62 216 Q105 187 148 216" stroke-width="7"/>
      <path d="M258 216 Q301 187 344 216" stroke-width="7"/>
    </g>
    <!-- propeller hubs -->
    <g fill="#2b4853" stroke="#d8f8fb" stroke-width="7">
      <circle cx="55" cy="82" r="18"/><circle cx="351" cy="82" r="18"/>
      <circle cx="105" cy="220" r="17"/><circle cx="301" cy="220" r="17"/>
    </g>
    <!-- four arms in realistic perspective -->
    <g fill="none" stroke="#283f49" stroke-width="30" stroke-linecap="round">
      <path d="M166 164 L64 89"/><path d="M240 164 L342 89"/>
      <path d="M171 205 L105 220"/><path d="M235 205 L301 220"/>
    </g>
    <g fill="none" stroke="#7aa9b5" stroke-width="5" stroke-linecap="round">
      <path d="M166 164 L64 89"/><path d="M240 164 L342 89"/>
      <path d="M171 205 L105 220"/><path d="M235 205 L301 220"/>
    </g>
    <!-- faceted aircraft body -->
    <path d="M149 139 Q202 111 255 139 L273 190 Q258 226 202 239 Q146 226 131 190 Z" fill="#263f4a"/>
    <path d="M166 144 Q202 125 238 144 L248 171 Q202 188 156 171 Z" fill="#547b87"/>
    <path d="M143 190 Q202 212 261 190 L249 211 Q202 234 155 211 Z" fill="#1a3039"/>
    <!-- front sensors -->
    <circle cx="166" cy="176" r="12" fill="#111e24"/><circle cx="238" cy="176" r="12" fill="#111e24"/>
    <circle cx="163" cy="173" r="4" fill="#c9f7fb"/><circle cx="235" cy="173" r="4" fill="#c9f7fb"/>
    <!-- landing legs -->
    <path d="M158 234 L139 299 M246 234 L265 299" fill="none" stroke="#263f49" stroke-width="12" stroke-linecap="round"/>
    <path d="M124 302 L155 302 M249 302 L280 302" fill="none" stroke="#d8f8fb" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 旗指物：竿、石突き、旗を明確に見せる配置 -->
  <g transform="translate(1135 25)" filter="url(#shadow)">
    <!-- 節のある竹の旗竿と石突き -->
    <rect x="92" y="42" width="12" height="650" rx="6" fill="url(#bamboo)"/>
    <g fill="#6b5525" opacity=".9">
      <rect x="89" y="107" width="18" height="9" rx="4"/>
      <rect x="89" y="257" width="18" height="9" rx="4"/>
      <rect x="89" y="407" width="18" height="9" rx="4"/>
    </g>
    <g fill="#e4cd8a" opacity=".8">
      <rect x="95" y="48" width="3" height="625" rx="2"/>
      <rect x="91" y="109" width="12" height="2" rx="1"/>
      <rect x="91" y="259" width="12" height="2" rx="1"/>
      <rect x="91" y="409" width="12" height="2" rx="1"/>
    </g>
    <!-- 白地の家旗。上端には旗幅を通る細い横棒（上乳の棒） -->
    <!-- 横棒は旗の内側を通し、右端だけ少し見える -->
    <path d="M98 52 L372 52" fill="none" stroke="url(#bamboo)" stroke-width="12" stroke-linecap="round"/>
    <path d="M98 52 L372 52" fill="none" stroke="#ead796" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M112 46 L365 46 L365 462 L112 462 Z" fill="#fffefb"/>
    <!-- 風になびかせず、掛けた状態のわずかな布じわだけを残す -->
    <path d="M140 67 C146 172 140 310 137 447" fill="none" stroke="#dce9e9" stroke-width="8" opacity=".35"/>
    <path d="M246 49 C252 166 247 318 252 452" fill="none" stroke="#cbdedf" stroke-width="7" opacity=".25"/>
    <path d="M309 59 C303 180 310 318 306 454" fill="none" stroke="#eef5f5" stroke-width="8" opacity=".70"/>
    <!-- 乳：旗の左端に並ぶ、竿を通す黒い筒状の留め具 -->
    <g fill="#1d2f35">
      <rect x="83" y="75" width="34" height="15" rx="3"/>
      <rect x="83" y="126" width="34" height="15" rx="3"/>
      <rect x="83" y="177" width="34" height="15" rx="3"/>
      <rect x="83" y="228" width="34" height="15" rx="3"/>
      <rect x="83" y="279" width="34" height="15" rx="3"/>
      <rect x="83" y="330" width="34" height="15" rx="3"/>
      <rect x="83" y="381" width="34" height="15" rx="3"/>
      <rect x="83" y="432" width="34" height="15" rx="3"/>
    </g>
    <g fill="#84a9af">
      <rect x="87" y="78" width="14" height="3" rx="1"/>
      <rect x="87" y="129" width="14" height="3" rx="1"/>
      <rect x="87" y="180" width="14" height="3" rx="1"/>
      <rect x="87" y="231" width="14" height="3" rx="1"/>
      <rect x="87" y="282" width="14" height="3" rx="1"/>
      <rect x="87" y="333" width="14" height="3" rx="1"/>
      <rect x="87" y="384" width="14" height="3" rx="1"/>
      <rect x="87" y="435" width="14" height="3" rx="1"/>
    </g>
    <!-- 旗のずり上がりを防ぐ固定具：竿の輪・下乳・よりひも・房 -->
    <ellipse cx="98" cy="490" rx="12" ry="5" fill="none" stroke="#8b5428" stroke-width="5"/>
    <path d="M86 490 C87 497 109 497 110 490" fill="none" stroke="#c38a48" stroke-width="2" opacity=".85"/>
    <!-- 旗下側の小さい乳 -->
    <rect x="136" y="455" width="10" height="23" rx="3" fill="#1d2f35"/>
    <rect x="139" y="459" width="2" height="15" rx="1" fill="#84a9af"/>
    <!-- 輪から乳へ結ぶ、目立つ赤のよりひも -->
    <path d="M110 490 C121 491 130 485 141 476" fill="none" stroke="#e60012" stroke-width="7" stroke-linecap="round"/>
    <path d="M111 489 C123 490 132 484 141 475" fill="none" stroke="#ff4b43" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 旗側に垂れる赤いよりひもと房 -->
    <path d="M141 477 C137 489 145 497 140 508" fill="none" stroke="#e60012" stroke-width="7" stroke-linecap="round"/>
    <path d="M142 478 C139 490 146 498 141 508" fill="none" stroke="#ff4b43" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 丸みのある赤い房 -->
    <ellipse cx="140" cy="510" rx="10" ry="5" fill="#d60012"/>
    <path d="M131 511 C132 522 133 531 140 535 C147 531 148 522 149 511 Z" fill="#e60012"/>
    <path d="M135 513 C135 522 136 528 140 532 M140 513 C140 522 140 529 140 533 M145 513 C145 522 144 528 141 532" fill="none" stroke="#ff4b43" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="183" y="112" width="112" height="104" fill="none" stroke="#151515" stroke-width="27"/>
    <rect x="183" y="292" width="112" height="104" fill="none" stroke="#151515" stroke-width="27"/>
  </g>
</svg>
